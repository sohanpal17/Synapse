name: synapse
description: Legal Practice Management for Indian Litigation Firms
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  cloud_functions: ^4.7.6
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.1.0
  table_calendar: ^3.0.9

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.13.1

  # File Handling
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  share_plus: ^7.2.1

  # Networking & Connectivity
  connectivity_plus: ^5.0.2

  # Notifications
  flutter_local_notifications: ^17.0.0
  audioplayers: ^6.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  url_launcher: ^6.2.2

  # Background Processing
  workmanager: ^0.9.0
  firebase_auth_platform_interface: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo/SYNAPSE.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "logo/SYNAPSE.jpg"
    background_color: "#ffffff"
    theme_color: "#2F4E73"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/